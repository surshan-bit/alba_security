# Publishes the private server functions (supabase/functions) to Supabase whenever they change on main, once the same checks as ci.yml pass.
# Needs one GitHub secret: SUPABASE_ACCESS_TOKEN (Supabase account settings -> Access Tokens).
name: deploy-functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run platform
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with: { version: 2.121.0 }
      - run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "No SUPABASE_ACCESS_TOKEN secret yet: skipping the deploy."; exit 0; fi
          supabase functions deploy --project-ref djxnoijgwtklszvgunma
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
