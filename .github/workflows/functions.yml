# Publishes the private server functions (supabase/functions) to Supabase whenever they change on main.
# Needs one GitHub secret: SUPABASE_ACCESS_TOKEN (Supabase account settings -> Access Tokens).
name: deploy-functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "No SUPABASE_ACCESS_TOKEN secret yet: skipping the deploy."; exit 0; fi
          supabase functions deploy --project-ref djxnoijgwtklszvgunma
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
