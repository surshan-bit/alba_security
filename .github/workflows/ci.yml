# Runs on every push to main and every pull request: builds the app and runs all the checks (the slow import flows in their own job, side by side with the rest). A red cross on GitHub means "do not release this".
name: checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # labeled / unlabeled: adding or removing the coverage-waiver label re-runs the checks
permissions:
  contents: read
jobs:
  # Everything except the import flows (about 4 minutes).
  check-main:
    runs-on: ubuntu-24.04   # Playwright 1.56 does not support ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }   # the changed-lines coverage check compares with the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high   # fails on a known high-severity problem in a package the site ships
      - run: npx playwright install --with-deps chromium   # the Playwright version is pinned in package.json
      - run: npm run check -- --part=main
      - run: npm run platform
      - run: npm run rls   # the database rules on a throw-away PostgreSQL (preinstalled on the runner); RLS_REQUIRED makes a missing server a failure, never a skip
        env: { RLS_REQUIRED: '1' }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: 2.9.6 }
      # type-checks the server function with its packages taken from the npm registry (--node-modules-dir=none: not the repo's node_modules) and
      # compared with the hashes in supabase/deno.lock; --frozen means a changed package or a new one nobody reviewed fails instead of updating the lock
      - run: deno check --frozen --node-modules-dir=none --lock=supabase/deno.lock supabase/functions/sample/index.ts
      - run: npm run coverage   # unit-test coverage of src/ may never fall below tools/coverage-ratchet.json
      - if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'coverage-waiver')
        run: npm run coverage -- --changed=origin/${{ github.base_ref }}   # every line this pull request adds or changes in src/ must be covered by a unit test, unless the pull request carries the coverage-waiver label (the reason goes in its description)
  # The import flows in Chromium: by far the slowest suite (about 7 minutes), so it runs beside the rest.
  check-imports:
    runs-on: ubuntu-24.04   # Playwright 1.56 does not support ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check -- --part=imports
  # The one result to look at (and to require on a pull request): green only when both parts are.
  check:
    needs: [check-main, check-imports]
    if: always()
    runs-on: ubuntu-24.04   # Playwright 1.56 does not support ubuntu-latest (26.04) yet
    steps:
      - run: |
          echo "check-main: ${{ needs.check-main.result }}, check-imports: ${{ needs.check-imports.result }}"
          test "${{ needs.check-main.result }}" = success && test "${{ needs.check-imports.result }}" = success
