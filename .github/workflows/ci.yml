# Runs on every push to main and every pull request: builds the app and runs all the checks. A red cross on GitHub means "do not release this".
name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high   # fails on a known high-severity problem in a package the site ships
      - run: npx playwright install --with-deps chromium   # the Playwright version is pinned in package.json
      - run: npm run check
      - run: npm run platform
