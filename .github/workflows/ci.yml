# Runs on every push and pull request: builds the app and runs all the checks. A red cross on GitHub means "do not release this".
name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run platform
